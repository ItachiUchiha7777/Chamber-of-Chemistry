<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE49E" />
      <stop offset="50%" stop-color="#D5A84B" />
      <stop offset="100%" stop-color="#A67B22" />
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18324B" />
      <stop offset="100%" stop-color="#0F1E2E" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="22" fill="url(#favBg)" />
  
  <!-- Outer orbital ring -->
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="#D5A84B" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" transform="rotate(30 50 50)" />

  <!-- Benzene Hexagon -->
  <polygon points="50,16 79,33 79,67 50,84 21,67 21,33" fill="rgba(45,111,145,0.2)" stroke="url(#favGold)" stroke-width="4" stroke-linejoin="round" />
  <!-- Resonance ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5,3" />

  <!-- Center Atom -->
  <circle cx="50" cy="50" r="7.5" fill="url(#favGold)" />
  
  <!-- Outer Vertices -->
  <circle cx="50" cy="16" r="4.5" fill="#38BDF8" />
  <circle cx="79" cy="33" r="4" fill="#FFE49E" />
  <circle cx="79" cy="67" r="4.5" fill="#38BDF8" />
  <circle cx="50" cy="84" r="4" fill="#FFE49E" />
  <circle cx="21" cy="67" r="4.5" fill="#38BDF8" />
  <circle cx="21" cy="33" r="4" fill="#FFE49E" />
</svg>
