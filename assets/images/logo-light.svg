<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cocGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE49E" />
      <stop offset="50%" stop-color="#D5A84B" />
      <stop offset="100%" stop-color="#E2B75A" />
    </linearGradient>
    <linearGradient id="cocBlueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2D6F91" />
    </linearGradient>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Molecular Icon Group -->
  <g transform="translate(15, 10)">
    <!-- Outer orbital rings -->
    <ellipse cx="50" cy="50" rx="46" ry="18" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" transform="rotate(-30 50 50)" />
    <ellipse cx="50" cy="50" rx="46" ry="18" fill="none" stroke="#D5A84B" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" transform="rotate(30 50 50)" />
    
    <!-- Benzene Hexagon -->
    <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="none" stroke="url(#cocGoldLight)" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Resonance Circle -->
    <circle cx="50" cy="50" r="20" fill="none" stroke="url(#cocBlueLight)" stroke-width="2.5" stroke-dasharray="5,3" />

    <!-- Core Central Atom -->
    <circle cx="50" cy="50" r="7" fill="url(#cocGoldLight)" filter="url(#glowLight)" />
    
    <!-- Outer Node Atoms -->
    <circle cx="50" cy="14" r="4.5" fill="#7DD3FC" />
    <circle cx="82" cy="32" r="4" fill="#FFE49E" />
    <circle cx="82" cy="68" r="4.5" fill="#7DD3FC" />
    <circle cx="50" cy="86" r="4" fill="#FFE49E" />
    <circle cx="18" cy="68" r="4.5" fill="#7DD3FC" />
    <circle cx="18" cy="32" r="4" fill="#FFE49E" />
  </g>

  <!-- Typography for Dark Navy Backgrounds -->
  <g transform="translate(135, 26)">
    <!-- Brand Name Line 1 -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#7DD3FC" text-transform="uppercase">
      CHAMBER OF
    </text>

    <!-- Brand Name Line 2 -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="3" fill="#FFFFFF">
      CHEMISTRY
    </text>

    <!-- Decorative Gold Accent Line -->
    <line x1="0" y1="67" x2="260" y2="67" stroke="url(#cocGoldLight)" stroke-width="2" stroke-linecap="round" />

    <!-- Tagline -->
    <text x="0" y="82" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#D5A84B" text-transform="uppercase">
      Quality Education for All
    </text>
  </g>
</svg>
