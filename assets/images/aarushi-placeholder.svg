<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18324B" />
      <stop offset="60%" stop-color="#0E1F30" />
      <stop offset="100%" stop-color="#07111A" />
    </linearGradient>
    <linearGradient id="goldAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D5A84B" />
      <stop offset="100%" stop-color="#9E7319" />
    </linearGradient>
    <linearGradient id="blueAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#2D6F91" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2D6F91" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#18324B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="600" height="700" rx="36" fill="url(#bgGrad)" />
  <rect width="600" height="700" rx="36" fill="url(#centerGlow)" />

  <!-- Outer Fine Border -->
  <rect x="12" y="12" width="576" height="676" rx="28" fill="none" stroke="url(#goldAura)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Subtle Chemistry Molecular Matrix Background -->
  <g opacity="0.15" stroke="#7DD3FC" stroke-width="1.2">
    <!-- Benzene rings in corner -->
    <polygon points="80,70 110,87 110,122 80,139 50,122 50,87" fill="none" />
    <circle cx="80" cy="105" r="18" fill="none" stroke-dasharray="3,3" />
    <line x1="110" y1="105" x2="150" y2="105" />
    <polygon points="170,70 200,87 200,122 170,139 140,122 140,87" fill="none" />
    
    <polygon points="520,540 550,557 550,592 520,609 490,592 490,557" fill="none" />
    <circle cx="520" cy="575" r="18" fill="none" stroke-dasharray="3,3" />
  </g>

  <!-- Atomic Orbital Ellipses Behind Silhouette -->
  <g transform="translate(300, 290)">
    <ellipse cx="0" cy="0" rx="210" ry="85" fill="none" stroke="#2D6F91" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5" transform="rotate(-35)" />
    <ellipse cx="0" cy="0" rx="210" ry="85" fill="none" stroke="url(#goldAura)" stroke-width="2" opacity="0.6" transform="rotate(35)" />
    <ellipse cx="0" cy="0" rx="220" ry="90" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" transform="rotate(90)" />

    <!-- Electron Orbits Particles -->
    <circle cx="170" cy="-60" r="5" fill="#FFE082" filter="url(#softGlow)" />
    <circle cx="-160" cy="70" r="5" fill="#7DD3FC" filter="url(#softGlow)" />
    <circle cx="30" cy="190" r="4" fill="#FFE082" />
  </g>

  <!-- Elegant Academic Crest / Portrait Frame -->
  <circle cx="300" cy="270" r="145" fill="#132639" stroke="url(#goldAura)" stroke-width="4" filter="url(#softGlow)" />
  <circle cx="300" cy="270" r="135" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" />

  <!-- Stylized Educator Silhouette / Avatar -->
  <g transform="translate(300, 270)">
    <!-- Scholar Cap / Laurel Leaf subtle accent -->
    <!-- Head -->
    <circle cx="0" cy="-35" r="42" fill="#E2E8F0" opacity="0.9" />
    <!-- Shoulders / Academic Robe silhouette -->
    <path d="M-75,70 C-75,10 -40,-10 0,-10 C40,-10 75,10 75,70 Z" fill="#CBD5E1" opacity="0.85" />
    
    <!-- Gold Medallion on Robe -->
    <circle cx="0" cy="38" r="16" fill="url(#goldAura)" />
    <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#18324B" text-anchor="middle">★</text>
  </g>

  <!-- Gold Medal Ribbon Badge -->
  <g transform="translate(300, 435)">
    <!-- Badge Background -->
    <rect x="-170" y="0" width="340" height="42" rx="21" fill="#18324B" stroke="url(#goldAura)" stroke-width="2" />
    <circle cx="-142" cy="21" r="12" fill="url(#goldAura)" />
    <text x="-142" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#18324B" text-anchor="middle">🥇</text>
    
    <text x="14" y="26" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#FFE49E" text-anchor="middle">
      M.Sc. ORGANIC CHEMISTRY GOLD MEDALLIST
    </text>
  </g>

  <!-- Founder Name & Credentials Card Base -->
  <g transform="translate(300, 520)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
      Aarushi Kasturiwal
    </text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#7DD3FC" text-anchor="middle" text-transform="uppercase">
      Founder &amp; Research Scholar
    </text>

    <!-- Credential Pills -->
    <g transform="translate(0, 75)">
      <!-- Pill 1 -->
      <rect x="-240" y="0" width="150" height="30" rx="15" fill="#203E5C" stroke="#2D6F91" stroke-width="1" />
      <text x="-165" y="19" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">B.Ed. &amp; M.A. Edu</text>

      <!-- Pill 2 -->
      <rect x="-75" y="0" width="150" height="30" rx="15" fill="#203E5C" stroke="#2D6F91" stroke-width="1" />
      <text x="0" y="19" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Ph.D. Scholar (2026-)</text>

      <!-- Pill 3 -->
      <rect x="90" y="0" width="150" height="30" rx="15" fill="#203E5C" stroke="#2D6F91" stroke-width="1" />
      <text x="165" y="19" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">NEET &amp; AFCAT Qualified</text>
    </g>

    <!-- Subtle location and initiative badge -->
    <text x="0" y="132" font-family="sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">
      Dehradun, Uttarakhand • #LetsPromoteFreeEducation
    </text>
  </g>
</svg>
