<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <circle cx="40" cy="40" r="38" fill="#18324B" />
  <!-- Isometric 3D Crystal Lattice Unit Cell -->
  <g transform="translate(40, 40) scale(0.9)">
    <!-- Back Cube lines -->
    <line x1="-15" y1="-5" x2="5" y2="-15" stroke="#2D6F91" stroke-width="1.8" stroke-dasharray="3,2" />
    <line x1="5" y1="-15" x2="25" y2="-5" stroke="#2D6F91" stroke-width="1.8" stroke-dasharray="3,2" />
    <line x1="5" y1="-15" x2="5" y2="15" stroke="#2D6F91" stroke-width="1.8" stroke-dasharray="3,2" />
    <!-- Front Cube lines -->
    <line x1="-15" y1="-5" x2="-15" y2="20" stroke="#D5A84B" stroke-width="2" />
    <line x1="-15" y1="20" x2="5" y2="30" stroke="#D5A84B" stroke-width="2" />
    <line x1="5" y1="30" x2="25" y2="20" stroke="#D5A84B" stroke-width="2" />
    <line x1="25" y1="20" x2="25" y2="-5" stroke="#D5A84B" stroke-width="2" />
    <line x1="-15" y1="-5" x2="5" y2="5" stroke="#D5A84B" stroke-width="2" />
    <line x1="5" y1="5" x2="25" y2="-5" stroke="#D5A84B" stroke-width="2" />
    <line x1="5" y1="5" x2="5" y2="30" stroke="#D5A84B" stroke-width="2" />
    <!-- Lattice Atoms -->
    <circle cx="-15" cy="-5" r="3.5" fill="#38BDF8" />
    <circle cx="5" cy="5" r="4" fill="#FFE082" />
    <circle cx="25" cy="-5" r="3.5" fill="#38BDF8" />
    <circle cx="-15" cy="20" r="3.5" fill="#38BDF8" />
    <circle cx="5" cy="30" r="4" fill="#FFE082" />
    <circle cx="25" cy="20" r="3.5" fill="#38BDF8" />
    <!-- Body center atom -->
    <circle cx="5" cy="10" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
  </g>
</svg>
